<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>بوابة أولياء الأمور — خطي</title><link rel="stylesheet" href="../assets/style.css"><link rel="stylesheet" href="../assets/style-v2.css"></head>
<body><div class="wrap"><main id="app"></main></div>
<script src="../assets/data.js"></script><script src="../assets/core.js"></script><script src="../assets/demo.js"></script><script src="../assets/app.js"></script>
<script>
(function(){
  K.page("بوابة أولياء الأمور","../index.html");
  const d=MYDRIVER;
  const l=K.line(d.lineId)||d;

  function render(){
    const att=K.attendance(d.lineId||"l1");
    const savedCode=K.get("parent_linked_code",att[0]?att[0].code:"KH-2233");
    const child=att.find(s=>s.code===savedCode)||att[0];
    const broadcasts=K.get("broadcasts",[]);
    /* §3.14.1 — إشعار صعود عبر تحقق PIN (لمرة واحدة) */
    const be=K.get("boardEv",null);
    if(be&&be.name){
      broadcasts.unshift({id:"b_"+Date.now(),msg:"✅ صعد "+be.name+" الباص (تحقق PIN)",time:be.time||"الآن",d:be.time||"الآن"});
      K.set("broadcasts",broadcasts);
      K.set("boardEv",null);
    }

    $("#app").innerHTML=`
      <div class="card">
        <h3>🔐 ربط حساب الابن / الابنة عبر الكود الخاص</h3>
        <div class="row" style="gap:8px;">
          <input id="pcode-in" value="${K.esc(savedCode)}" placeholder="مثال: KH-4829" style="flex:1;">
          <button class="btn btn-p" id="link-btn">ربط ومتابعة</button>
        </div>
        <div class="mut" style="margin-top:4px;">أكواد تجريبية متاحة: <code>${att.map(x=>x.code).join("</code> ، <code>")}</code></div>
      </div>

      <div class="card" style="border:2px solid #123a5c;">
        <h3>🎓 حالة الطالب المتابع: ${K.esc(child.name)}</h3>
        <p><strong>نقطة الصعود:</strong> ${K.esc(child.stop)} • <strong>الكود:</strong> ${K.esc(child.code)}</p>
        <p><strong>الحالة اللحظية اليوم:</strong> <b>${
          child.status==="absent"?"🔴 مسجل غائب اليوم":
          child.status==="boarded"?"🟢 صعد إلى الحافلة وفي الطريق":
          child.status==="arrived"?"🎓 وصل إلى الجامعة بأمان":"⏳ بانتظار وصول الحافلة صباحاً"
        }</b> ${child.updatedAt?`<span class="mut">(${K.esc(child.updatedAt)})</span>`:""}</p>
        <div class="row" style="gap:8px;flex-wrap:wrap;margin-top:8px;">
          <a class="btn btn-p" href="../passenger/tracking.html?id=${K.esc(d.lineId||'l1')}">📍 تتبع الحافلة على الخريطة</a>
          <button class="btn btn-a" id="parent-skip-btn">
            ${child.status==="absent"?"↩️ إلغاء غياب اليوم":"✋ إبلاغ السائق بغياب ابني اليوم"}
          </button>
        </div>
      </div>

      <div class="card">
        <h3>🚘 بيانات السائق المعتمد</h3>
        <p><strong>السائق:</strong> ${K.esc(d.name)} ${K.trusted(d)}</p>
        <p><strong>الهاتف:</strong> <a href="tel:${K.esc(d.phone)}">${K.esc(d.phone)}</a></p>
        <p><strong>المركبة:</strong> ${K.esc(l.vehicle||d.vehicle)} — ${K.esc(d.plate||"")}</p>
        <p><strong>المسار:</strong> ${K.esc(l.from?`${l.from} ↔ ${l.to}`:d.route)}</p>
      </div>

      <div class="card">
        <h3>📢 سجل الإشعارات الفورية وحركة الصعود</h3>
        ${broadcasts.length===0?'<div class="mut">لا توجد إشعارات حديثة.</div>':broadcasts.map(b=>`
          <div class="note" style="margin-bottom:8px;">
            <strong>📢 ${K.esc(b.time||b.d||"الآن")}:</strong> ${K.esc(b.msg||b.t||"")}
          </div>
        `).join("")}
      </div>
    `;

    $("#link-btn").onclick=function(){
      const v=$("#pcode-in").value.trim().toUpperCase();
      K.set("parent_linked_code",v);
      K.toast("تم تحديث ربط كود الطالب: "+v);
      render();
    };

    $("#parent-skip-btn").onclick=function(){
      K.setStudentStatus(d.lineId||"l1",child.id,child.status==="absent"?"waiting":"absent");
      render();
    };
  }

  render();
})();
</script>
</body></html>
