<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل حساب</title><link rel="stylesheet" href="assets/style.css"></head>
<body><div class="wrap"><main id="app"></main></div>
<script src="assets/data.js"></script><script src="assets/core.js"></script><script src="assets/demo.js"></script><script src="assets/app.js"></script>
<script>
(function(){
if(!K.access())return;
K.page("تسجيل حساب","index.html");
const app=$("#app");
const role0=new URLSearchParams(location.search).get("role");
const me=K.get("me",null),dv=K.get("driver",null);
let role=["passenger","driver"].includes(role0)?role0:"",codeSent=false,codeOk=false,vcodeSent=false,vcodeOk=false;
let pN="",pP="",dN="",dP="";

if(me&&role!=="driver"){app.innerHTML=`<div class="ok-note">✓ لديك حساب راكب مسجل: <b>${K.esc(me.name)}</b></div>
<a class="btn btn-p" href="passenger/search.html">متابعة إلى التطبيق ←</a>
<button class="btn btn-g" onclick="K.set('me',null);location.reload()">تسجيل خروج</button>`}
else if(dv&&dv.verified&&role!=="passenger"){app.innerHTML=`<div class="ok-note">✓ لديك حساب سائق تجريبي — غير موثّق فعليًا: <b>${K.esc(dv.name)}</b></div>
<a class="btn btn-p" href="driver/index.html">متابعة إلى لوحة السائق ←</a>
<button class="btn btn-g" onclick="K.set('driver',null);location.reload()">تسجيل خروج</button>`}
else if(dv&&!dv.verified&&role!=="passenger"){waiting()}
else{app.innerHTML=`
<div class="card"><h3>اختر نوع الحساب</h3>
<div class="row">
<button class="btn ${role==="passenger"?"btn-p":"btn-g"}" style="margin-top:0" onclick="pick('passenger')">🧑‍🎓 راكب</button>
<button class="btn ${role==="driver"?"btn-p":"btn-g"}" style="margin-top:0" onclick="pick('driver')">🚌 سائق</button>
</div></div><div id="form"></div>`;
if(role)renderForm()}
function pick(r){role=r;codeSent=codeOk=vcodeSent=vcodeOk=false;history.replaceState(null,"","register.html?role="+r);
$$("#app .row .btn").forEach((b,i)=>{b.className="btn "+((i===0)===(r==="passenger")?"btn-p":"btn-g");b.style.marginTop="0"});renderForm()}
function codeBox(pref){return `<div id="${pref}codebox" style="display:${codeSent||vcodeSent?"block":"none"}">
<div class="ok-note">📱 محاكاة رمز تحقق؛ لم تُرسل رسالة (تجريبي: <b>أي رمز من 4 أرقام</b> يُقبل).</div>
<div class="field"><label>رمز التحقق</label><input id="${pref}code" inputmode="numeric" maxlength="4" placeholder="••••" dir="ltr" style="text-align:center;letter-spacing:6px;font-size:20px"></div>
<button class="btn btn-p" id="${pref}verify">تحقق ✓</button></div>`}
function renderForm(){const f=$("#form");if(!f)return;
if(role==="passenger"){f.innerHTML=`
<div class="card"><h3>🧑‍🎓 تسجيل راكب</h3>
<div class="field"><label>الاسم الكامل</label><input id="pname" placeholder="مثال: زهراء محمد" value="${K.esc(pN)}"></div>
<div class="field"><label>رقم الهاتف العراقي</label><input id="pphone" inputmode="numeric" placeholder="07xxxxxxxxx" dir="ltr" style="text-align:right" value="${K.esc(pP)}"></div>
<button class="btn btn-g" id="psend">أرسل رمز التحقق 📲</button>${codeBox("p")}
<div id="pfinal" style="display:${codeOk?"block":"none"}">
<div class="field" style="margin-top:10px"><label>ربط ابن (اختياري) — اسم الابن</label><input id="cname" placeholder="مثال: علي"></div>
<div class="field"><label>رمز الدعوة (اختياري)</label><input id="ccode" placeholder="يرسله الابن من حسابه" dir="ltr" style="text-align:right"></div>
<button class="btn btn-a" id="pdone">إتمام التسجيل ✓</button></div></div>`;
$("#psend").onclick=()=>{pN=$("#pname").value;pP=$("#pphone").value;
if(!KhattiCore.name(pN)){K.toast("أدخل الاسم");return}
if(!/^07\d{9}$/.test(pP.trim())){K.toast("رقم الهاتف يجب أن يبدأ بـ 07 ويتكون من 11 رقمًا");return}
codeSent=true;renderForm();K.toast("محاكاة فقط: لم يُرسل رمز للهاتف")};
const pv=$("#pverify");if(pv)pv.onclick=()=>{if(!/^\d{4}$/.test($("#pcode").value.trim())){K.toast("الرمز 4 أرقام (تجريبي: أي 4 أرقام)");return}
codeOk=true;renderForm();K.toast("اكتملت محاكاة الرمز؛ لا تحقق أمني حقيقي")};
const pd=$("#pdone");if(pd)pd.onclick=()=>{const kids=[];
if(!codeOk||$("#pname").value!==pN||$("#pphone").value!==pP){K.toast("أعد محاكاة الرمز بعد تعديل الاسم أو الهاتف");return}
if($("#cname").value.trim())kids.push({name:$("#cname").value.trim(),code:$("#ccode").value.trim()});
K.set("me",{name:$("#pname").value.trim(),phone:$("#pphone").value.trim(),role:"passenger",children:kids});
K.toast("أهلًا "+$("#pname").value.trim()+" 🎉");setTimeout(()=>location.href="passenger/search.html",900)}}
else if(role==="driver"){f.innerHTML=`
<div class="card"><h3>🚌 تسجيل سائق — محاكاة التوثيق</h3>
<div class="field"><label>الاسم الكامل</label><input id="dname" placeholder="مثال: ستار جبار" value="${K.esc(dN)}"></div>
<div class="field"><label>رقم الهاتف العراقي</label><input id="dphone" inputmode="numeric" placeholder="07xxxxxxxxx" dir="ltr" style="text-align:right" value="${K.esc(dP)}"></div>
<button class="btn btn-g" id="dsend">أرسل رمز التحقق 📲</button>${codeBox("v")}
<div id="vfinal" style="display:${vcodeOk?"block":"none"}">
<h3 style="margin:12px 0 8px">🚐 بيانات المركبة</h3>
<div class="field"><label>نوع المركبة</label><select id="vtype"><option>كوستر</option><option>هايس</option><option>باص صغير</option><option>سيدان</option></select></div>
<div class="row"><div class="field grow"><label>رقم اللوحة</label><input id="vplate" placeholder="مثال: ب 12345"></div>
<div class="field grow"><label>سنة الصنع</label><input id="vyear" type="number" min="1990" max="${new Date().getFullYear()}" value="2020"></div></div>
<div class="field"><label>عدد المقاعد</label><input id="vseats" type="number" min="4" max="60" value="14"></div>
<div class="field"><label>صورة إجازة السوق</label><input id="vlic" type="file" accept="image/*"><div class="mut" id="licname" style="margin-top:4px"></div></div>
<button class="btn btn-a" id="ddone">إرسال للمراجعة البشرية 📋</button></div></div>
<div class="danger-note">⚠️ لن تُنشر خطوطك أو إعلاناتك حتى تُراجَع بياناتك وتُقبَل — حماية للركاب.</div>`;
$("#vlic").onchange=e=>{if(e.target.files[0])$("#licname").textContent="✓ تم اختيار: "+e.target.files[0].name+" (محاكاة رفع)"};
$("#dsend").onclick=()=>{dN=$("#dname").value;dP=$("#dphone").value;
if(!KhattiCore.name(dN)){K.toast("أدخل الاسم");return}
if(!/^07\d{9}$/.test(dP.trim())){K.toast("رقم الهاتف يجب أن يبدأ بـ 07 ويتكون من 11 رقمًا");return}
vcodeSent=true;renderForm();K.toast("محاكاة فقط: لم يُرسل رمز للهاتف")};
const vv=$("#vverify");if(vv)vv.onclick=()=>{if(!/^\d{4}$/.test($("#vcode").value.trim())){K.toast("الرمز 4 أرقام (تجريبي: أي 4 أرقام)");return}
vcodeOk=true;renderForm();K.toast("اكتملت محاكاة الرمز؛ لا تحقق أمني حقيقي")};
const dd=$("#ddone");if(dd)dd.onclick=()=>{const yr=+$("#vyear").value,seats=+$("#vseats").value;
if(!vcodeOk||$("#dname").value!==dN||$("#dphone").value!==dP){K.toast("أعد محاكاة الرمز بعد تعديل الاسم أو الهاتف");return}
if(!$("#vplate").value.trim()||$("#vplate").value.length>30){K.toast("أدخل رقم اللوحة");return}
if(!KhattiCore.integer(yr,1990,new Date().getFullYear())){K.toast("سنة الصنع غير صحيحة");return}
if(!KhattiCore.integer(seats,4,60)){K.toast("عدد المقاعد بين 4 و 60");return}
if(!$("#vlic").files.length||!$("#vlic").files[0].type.startsWith("image/")||$("#vlic").files[0].size>5*1024*1024){K.toast("أرفق صورة تجريبية لا تتجاوز 5 ميغابايت");return}
K.set("driver",{name:$("#dname").value.trim(),phone:$("#dphone").value.trim(),role:"driver",verified:false,
vehicle:{type:$("#vtype").value,plate:$("#vplate").value.trim(),year:yr,seats,lic:$("#vlic").files[0].name}});
waiting()}}}
function waiting(){const d=K.get("driver",null);if(!d){location.href="register.html";return}
app.innerHTML=`<div class="card" style="text-align:center;padding:30px 14px"><div style="font-size:50px">⏳</div>
<h3>محاكاة حساب قيد المراجعة</h3>
<p class="mut" style="line-height:1.9;margin:8px 0">أهلًا <b>${K.esc(d.name)}</b> — حُفظت محليًا بيانات العرض وبيانات المركبة (${K.esc(d.vehicle.type)} — لوحة ${K.esc(d.vehicle.plate)}).<br>
لن تُنشر خطوطك أو إعلاناتك حتى تُراجَع وتُقبَل.<br>لا تُرسل البيانات لمراجع بشري ولا تصلك إشعارات فعلية.</p>
<div class="ok-note" style="text-align:right">🧪 <b>وضع تجريبي:</b> زر المحاكاة أدناه يمثّل قرار المراجع البشري.</div>
<button class="btn btn-a" id="simok">محاكاة قبول المراجعة ✓</button>
<button class="btn btn-g" onclick="K.set('driver',null);location.href='register.html'">إلغاء التسجيل</button></div>`;
$("#simok").onclick=()=>{d.verified=true;K.set("driver",d);K.toast("محاكاة قبول فقط؛ لم يُوثّق الحساب فعليًا");setTimeout(()=>location.href="driver/index.html",900)}}

window.pick=pick;
})();
</script></body></html>
