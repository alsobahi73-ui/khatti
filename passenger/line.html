<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>تفاصيل الخط — خطي</title><link rel="stylesheet" href="../assets/style.css"><link rel="stylesheet" href="../assets/style-v2.css"></head>
<body><div class="wrap"><main id="app"></main></div>
<script src="../assets/data.js"></script><script src="../assets/core.js"></script><script src="../assets/demo.js"></script><script src="../assets/auth.js"></script><script src="../assets/cloud.js"></script><script src="../assets/data-source.js"></script><script src="../assets/app.js"></script>
<script>
(async function(){
  if(!K.access())return;
  K.page("تفاصيل الخط","search.html");
  const lines=await loadLines();
  const id=new URLSearchParams(location.search).get("id")||"l1";
  const l=K.line(id)||(Array.isArray(lines)?lines.find(x=>x.id===id):null);
  if(!l){K.missing();return;}
  const cloud=window.KhattiCloud;
  const isCloud=Boolean(cloud&&typeof cloud.isConfigured==="function"&&cloud.isConfigured());
  let lineBroadcasts=[];
  if(isCloud&&typeof cloud.pullBroadcasts==="function"){
    try{
      const remoteBroadcasts=await cloud.pullBroadcasts(l.id);
      if(Array.isArray(remoteBroadcasts))lineBroadcasts=remoteBroadcasts;
    }catch(_){}
  }else{
    lineBroadcasts=K.get("broadcasts",[]).filter(b=>b&&(!b.line_id&&!b.lineId||b.line_id===l.id||b.lineId===l.id));
  }
  $("#app").innerHTML=`
    <div class="card">
      <div class="row">${K.badge(l.comp)}${K.trusted(l)}<span class="grow"></span><b>${K.fmt(l.price)}/شهر</b></div>
      <h2 style="margin:8px 0;">${K.esc(l.from)} ← ${K.esc(l.to)}</h2>
      <div class="mut">السائق: ${K.esc(l.driver||l.driverName)} • ${K.esc(l.vehicle)}</div>
      <div class="row" style="margin-top:12px;gap:6px;flex-wrap:wrap;">
        <a class="btn btn-p" href="booking.html?id=${K.esc(l.id)}">💺 حجز مقعد</a>
        <a class="btn btn-g" href="tracking.html?id=${K.esc(l.id)}">📍 التتبع اللحظي</a>
        <a class="btn btn-g" href="chat.html?id=${K.esc(l.id)}">💬 محادثة</a>
        <a class="btn btn-g" href="report.html?id=${K.esc(l.id)}">⚠️ إبلاغ</a>
      </div>
    </div>
    <div class="card"><h3>📍 محطات التجمع</h3>${K.stepperHTML(l,1)}</div>
    <div class="card" id="line-broadcasts">
      <h3>📢 تنبيهات الخط</h3>
      ${lineBroadcasts.length===0?'<div class="mut">لا توجد تنبيهات حالية على هذا الخط.</div>':lineBroadcasts.map(b=>`<div class="note" style="margin-bottom:6px;"><b>${K.esc(b.time_label||b.time||b.d||"الآن")}:</b> ${K.esc(b.msg||b.t||"")}</div>`).join("")}
    </div>
  `;
})();
</script></body></html>
