<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>تفاصيل الخط — خطي</title><link rel="stylesheet" href="../assets/style.css"><link rel="stylesheet" href="../assets/style-v2.css"></head>
<body><div class="wrap"><main id="app"></main></div>
<script src="../assets/data.js"></script><script src="../assets/core.js"></script><script src="../assets/demo.js"></script><script src="../assets/app.js"></script>
<script>
(function(){
  if(!K.access())return;
  const id=new URLSearchParams(location.search).get("id")||"l1";
  const l=K.line(id);
  K.page("تفاصيل الخط","search.html");
  if(!l){K.missing();return;}
  $("#app").innerHTML=`
    <div class="card">
      <div class="row">${K.badge(l.comp)}${K.trusted(l)}<span class="grow"></span><b>${K.fmt(l.price)}/شهر</b></div>
      <h2 style="margin:8px 0;">${K.esc(l.from)} ← ${K.esc(l.to)}</h2>
      <div class="mut">السائق: ${K.esc(l.driver||l.driverName)} • ${K.esc(l.vehicle)}</div>
      <div class="row" style="margin-top:12px;gap:6px;flex-wrap:wrap;">
        <a class="btn btn-p" href="booking.html?id=${K.esc(l.id)}">💺 حجز مقعد</a>
        <a class="btn btn-g" href="tracking.html?id=${K.esc(l.id)}">📍 التتبع اللحظي</a>
        <a class="btn btn-g" href="chat.html?id=${K.esc(l.id)}">💬 محادثة</a>
        <a class="btn btn-g" href="report.html?id=${K.esc(l.id)}">⚠️ إبلاغ</a>
      </div>
    </div>
    <div class="card"><h3>📍 محطات التجمع</h3>${K.stepperHTML(l,1)}</div>
  `;
})();
</script></body></html>
