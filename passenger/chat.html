<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>المحادثة — خطي</title><link rel="stylesheet" href="../assets/style.css"><link rel="stylesheet" href="../assets/style-v2.css"></head>
<body><div class="wrap"><main id="app"></main></div>
<script src="../assets/data.js"></script><script src="../assets/core.js"></script><script src="../assets/demo.js"></script><script src="../assets/app.js"></script>
<script>
(function(){
  if(!K.access())return;
  const id=new URLSearchParams(location.search).get("id")||"l1";
  const l=K.line(id);
  K.page("محادثة الخط","search.html");
  if(!l){K.missing();return;}
  function render(){
    const msgs=K.get("chat_"+l.id,[]);
    $("#app").innerHTML=`
      <div class="card">
        <h3>💬 محادثة ${K.esc(l.from)} ← ${K.esc(l.to)}</h3>
        <div id="cbox" style="margin:10px 0;">${msgs.map(m=>`<div class="note"><b>${m.me?'أنا':K.esc(l.driver)}:</b> ${K.esc(m.t)} <span class="mut">(${K.esc(m.time)})</span></div>`).join("")}</div>
        <div class="row"><input id="cin" placeholder="اكتب رسالتك..." style="flex:1;"><button class="btn btn-p" id="csend">إرسال</button></div>
      </div>
    `;
    $("#csend").onclick=function(){
      const v=$("#cin").value.trim();
      if(!v)return;
      msgs.push({me:1,t:v,time:"الآن"});
      K.set("chat_"+l.id,msgs);
      render();
    };
  }
  render();
})();
</script></body></html>
