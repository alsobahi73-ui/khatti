<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رحلاتي</title><link rel="stylesheet" href="../assets/style.css"></head>
<body><div class="wrap"><main id="app"></main></div>
<script src="../assets/runtime.js"></script><script src="../assets/data.js"></script><script src="../assets/core.js"></script><script src="../assets/demo.js"></script><script src="../assets/app.js"></script>
<script>
(function(){
if(!K.access())return;
K.page("رحلاتي","search.html");
const trips=K.get("trips",[]).filter(t=>t&&K.tripLine(t));const app=$("#app");
if(!trips.length){app.innerHTML=`<div class="bigempty"><div class="ic">🎫</div>لا توجد رحلات بعد<br><a class="btn btn-p" href="search.html" style="margin-top:12px">ابحث عن خط</a></div>`}
else app.innerHTML=trips.map(t=>{const l=K.tripLine(t);const isHol=!!t.holId;return `
<div class="card"><div class="row">${K.badge(l.comp)}${isHol?'<span class="mut">🎉 رحلة عطلة</span>':""}<span class="grow"></span><span class="mut">${K.esc(t.when)}</span></div>
<div style="font-weight:800;margin:6px 0">${K.esc(l.from)} ← ${K.esc(l.to)}</div>
<div class="mut">${K.esc(l.driver)}${t.seats?` • ${t.seats} مقاعد`:""} • ${K.esc(t.type||"")}${t.pay?" • "+K.esc(t.pay):""}</div>
<div class="row" style="margin-top:8px">
${t.status==="upcoming"&&!isHol?`<a class="btn btn-p btn-s" href="tracking.html?id=${l.id}">تتبع</a>`:""}
${t.status==="upcoming"&&isHol?`<button class="btn btn-g btn-s" onclick="holDone('${t.id}')">محاكاة انتهاء الرحلة</button>`:""}
${t.status==="done"&&!t.rated?`<a class="btn btn-a btn-s" href="rate.html?trip=${t.id}">قيّم الرحلة</a>`:""}
${t.status==="done"&&t.rated?`<span class="mut">تم التقييم ✓</span>`:""}
${t.status==="done"?`<a class="btn btn-g btn-s" href="report.html?${isHol?"hol="+t.holId:"id="+l.id}">بلاغ مخالفة</a>`:""}
</div></div>`}).join("")+`<a class="btn btn-g" href="search.html">+ حجز رحلة جديدة</a>`;
function holDone(id){const tr=K.get("trips",[]);const t=tr.find(x=>x.id===id);if(t){t.status="done";K.set("trips",tr);K.toast("انتهت الرحلة — يمكنك الآن التقييم والبلاغ");setTimeout(()=>location.reload(),700)}}

window.holDone=holDone;
})();
</script></body></html>
