<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>رحلات العطلة — خطي</title><link rel="stylesheet" href="../assets/style.css"><link rel="stylesheet" href="../assets/style-v2.css"></head>
<body><div class="wrap"><main id="app"></main></div>
<script src="../assets/data.js"></script><script src="../assets/core.js"></script><script src="../assets/demo.js"></script><script src="../assets/app.js"></script>
<script>
(function(){
  /* §3.12 — بوابة التسجيل: رحلات العطل مخفية حتى تسجيل حساب راكب */
  const me=K.get("me",null);
  K.page("خط العطلة والمناسبات","search.html");
  if(!me){
    $("#app").innerHTML=`
      <div class="card" style="text-align:center;padding:30px 14px">
        <div style="font-size:48px">🔒</div>
        <h3>سجّل حساب راكب لرؤية رحلات العطل</h3>
        <p class="mut">إعلانات الرحلات لا تظهر إلا للمسجلين — سجّل مجانًا خلال دقيقة.</p>
        <a class="btn btn-p" href="../register.html?role=passenger">سجّل كراكب ←</a>
      </div>`;
    return;
  }
  const list=HOLIDAYS.concat(K.get("holPosts",[])).filter(h=>KhattiCore.future(h.date,h.time));
  let saved=false;
  window.bookHol=function(id){
    if(saved)return;
    const h=list.find(x=>x.id===id);
    if(!h||!KhattiCore.future(h.date,h.time)||!KhattiCore.integer(K.holFree(h),1,60)){K.toast("الرحلة غير متاحة أو اكتملت المقاعد");return}
    const bookings=K.get("bookings",[]);
    if(bookings.some(x=>x.holId===id&&x.status==="upcoming")){K.toast("لديك حجز تجريبي قائم لهذه الرحلة");return}
    const entry={id:"hb_"+Date.now(),holId:id,when:h.dlabel+" — "+h.time,seats:1,status:"upcoming",rated:false,type:"رحلة عطلة تجريبية"};
    const holSeats=K.get("holSeats",{});holSeats[id]=K.holFree(h)-1;
    try{K.commit({holSeats,bookings:[entry,...bookings],trips:[entry,...K.get("trips",[])]})}catch(e){K.toast("تعذّر حفظ الحجز المحلي؛ لم يتم تأكيده.");return}
    saved=true;K.toast("حُفظ مقعد تجريبي محليًا؛ لا حجز فعلي ولا دفع");setTimeout(()=>location.href="trips.html",900);
  };
  $("#app").innerHTML='<div class="note">محاكاة محلية فقط؛ لا تصل الحجوزات إلى سائق ولا يتم دفع فعلي.</div>'+(list.length?list.map(h=>K.holCard(h,"bookHol")).join(""):'<div class="card">لا توجد رحلات مستقبلية متاحة حاليًا.</div>');
})();
</script></body></html>
