<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>رحلات العطلة — خطي</title><link rel="stylesheet" href="../assets/style.css"><link rel="stylesheet" href="../assets/style-v2.css"></head>
<body><div class="wrap"><main id="app"></main></div>
<script src="../assets/data.js"></script><script src="../assets/core.js"></script><script src="../assets/demo.js"></script><script src="../assets/app.js"></script>
<script>
(function(){
  /* §3.12 — بوابة التسجيل: رحلات العطل مخفية حتى تسجيل حساب راكب */
  const me=K.get("me",null);
  K.page("خط العطلة والمناسبات","search.html");
  if(!me){
    $("#app").innerHTML=`
      <div class="card" style="text-align:center;padding:30px 14px">
        <div style="font-size:48px">🔒</div>
        <h3>سجّل حساب راكب لرؤية رحلات العطل</h3>
        <p class="mut">إعلانات الرحلات لا تظهر إلا للمسجلين — سجّل مجانًا خلال دقيقة.</p>
        <a class="btn btn-p" href="../register.html?role=passenger">سجّل كراكب ←</a>
      </div>`;
    return;
  }
  const list=HOLIDAYS.concat(K.get("holPosts",[]));
  window.bookHol=function(id){
    K.toast("تم حجز مقعدك في رحلة العطلة ✓");
  };
  $("#app").innerHTML=list.map(h=>K.holCard(h,"bookHol")).join("");
})();
</script></body></html>
