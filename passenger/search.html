<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>البحث عن خط — خطي</title><link rel="stylesheet" href="../assets/style.css"><link rel="stylesheet" href="../assets/style-v2.css"></head>
<body><div class="wrap"><main id="app"></main></div>
<script src="../assets/data.js"></script><script src="../assets/core.js"></script><script src="../assets/demo.js"></script><script src="../assets/app.js"></script>
<script>
(function(){
  /* §3.12 — بوابة التسجيل: إعلانات الخطوط مخفية حتى تسجيل حساب راكب */
  const me=K.get("me",null);
  K.page("البحث عن الخطوط","../index.html");
  K.holBanner();
  if(!me){
    $("#app").insertAdjacentHTML("beforeend",`
      <div class="card" style="text-align:center;padding:30px 14px">
        <div style="font-size:48px">🔒</div>
        <h3>سجّل حساب راكب لرؤية الخطوط</h3>
        <p class="mut">إعلانات الخطوط لا تظهر إلا للمسجلين — سجّل مجانًا خلال دقيقة.</p>
        <a class="btn btn-p" href="../register.html?role=passenger">سجّل كراكب ←</a>
      </div>`);
    return;
  }
  $("#app").insertAdjacentHTML("beforeend",`
    <div class="card">
      <div class="row" style="gap:8px;flex-wrap:wrap;">
        <div class="field grow"><label>من منطقة</label><select id="sfrom"><option value="">الكل</option>${AREAS.map(a=>`<option>${K.esc(a)}</option>`).join("")}</select></div>
        <div class="field grow"><label>إلى وجهة</label><select id="sto"><option value="">الكل</option>${AREAS.map(a=>`<option>${K.esc(a)}</option>`).join("")}</select></div>
      </div>
    </div>
    <div id="list"></div>
  `);
  function render(){
    const f=$("#sfrom").value, t=$("#sto").value;
    const items=LINES.map(x=>K.line(x.id)).filter(l=>l&&(!f||l.from.includes(f))&&(!t||l.to.includes(t)));
    $("#list").innerHTML=items.length?items.map(l=>K.lineCard(l)).join(""):'<div class="mut">لا توجد خطوط مطابقة.</div>';
  }
  $("#sfrom").onchange=render;
  $("#sto").onchange=render;
  render();
})();
</script></body></html>
