<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>إبلاغ — خطي</title><link rel="stylesheet" href="../assets/style.css"><link rel="stylesheet" href="../assets/style-v2.css"></head>
<body><div class="wrap"><main id="app"></main></div>
<script src="../assets/data.js"></script><script src="../assets/core.js"></script><script src="../assets/demo.js"></script><script src="../assets/app.js"></script>
<script>
(function(){
  if(!K.access())return;
  const id=new URLSearchParams(location.search).get("id")||"l1";
  const l=K.line(id);
  K.page("تقديم بلاغ","search.html");
  if(!l){K.missing();return;}
  $("#app").innerHTML=`
    <div class="card">
      <h3>⚠️ إبلاغ عن مشكلة في ${K.esc(l.from)} ← ${K.esc(l.to)}</h3>
      <div class="field"><label>السبب</label><select id="rsn">${REASONS.map(r=>`<option>${K.esc(r)}</option>`).join("")}</select></div>
      <button class="btn btn-p" id="rep-ok">إرسال البلاغ</button>
    </div>
  `;
  $("#rep-ok").onclick=function(){
    K.toast("تم تسجيل البلاغ بنجاح");
    setTimeout(()=>location.href="trips.html",800);
  };
})();
</script></body></html>
