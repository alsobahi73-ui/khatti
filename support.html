<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تواصل مع الدعم — خطّي</title><link rel="stylesheet" href="assets/style-legacy.css"></head>
<body><div class="wrap">
<div class="hero"><h1>💬 الدعم والتواصل</h1><p>عندك سؤال أو مشكلة؟ راسل فريق خطّي مباشرة</p></div>
<main>
<div class="card"><h3>❓ أسئلة شائعة</h3><div id="faq"></div></div>
<div class="card"><h3>📩 راسلنا</h3>
<div class="field"><label for="sname">الاسم</label><input id="sname" placeholder="اسمك"></div>
<div class="field"><label for="stopic">نوع الاستفسار</label><select id="stopic"><option>حجز ومقاعد</option><option>الدفع</option><option>بلاغ عن مخالفة</option><option>اقتراح ميزة</option><option>أخرى</option></select></div>
<div class="field"><label for="smsg">رسالتك</label><textarea id="smsg" placeholder="اكتب رسالتك هنا..."></textarea></div>
<button class="btn btn-p" id="send">حفظ رسالة تجريبية</button>
<div class="note" id="sok" style="display:none">حُفظت الرسالة محليًا للتجربة فقط؛ لم تُرسل إلى فريق دعم.</div>
<div class="note">عرض تجريبي؛ لا توجد قناة دعم مرتبطة بهذه الصفحة حاليًا.</div>
</div>
<div class="card">
<h3>🛠️ تقارير الأخطاء التقنية</h3>
<button type="button" class="btn btn-a" id="btn-report-issue">الإبلاغ عن مشكلة</button>
<div id="error-report-box" style="display:none;margin-top:10px;">
  <div class="field"><label for="err-report-msg">وصف المشكلة</label><input id="err-report-msg" type="text" maxlength="500" placeholder="اشرح المشكلة باختصار"></div>
  <div class="field"><label for="err-report-details">تفاصيل الخطأ (اختياري)</label><textarea id="err-report-details" rows="3" placeholder="تفاصيل إضافية أو تقنية"></textarea></div>
  <button type="button" class="btn btn-p" id="err-report-submit">إرسال التقرير</button>
  <div class="note" id="err-report-status" style="display:none;margin-top:8px;"></div>
</div>
</div>
<a class="btn btn-g" href="index.html">→ رجوع للرئيسية</a>
</main><footer class="app">خطّي • <a href="privacy.html">الخصوصية</a> • <a href="terms.html">الشروط</a> • صُنع في العراق 🇮🇶</footer>
</div>
<script src="assets/data.js"></script><script src="assets/core.js"></script><script src="assets/demo.js"></script><script src="assets/auth.js"></script><script src="assets/cloud.js"></script><script src="assets/app.js"></script>
<script>
const FAQ=[["كيف أحجز مقعدًا؟","من واجهة الراكب: ابحث عن خط، اختر الخط، ثم احجز واختر خطة الاشتراك ونقطة الصعود. عند تفعيل الاتصال السحابي يُحفظ الحجز في حسابك ويظهر للسائق؛ دون تفعيل يبقى الحجز على جهازك فقط."],["كيف أدفع؟","الدفع يدوي: نقدًا أو عبر Zain Cash أو Asia Hawala، ويؤكد السائق دفعك من لوحته. لا يوجد خصم آلي من أي حساب."],["كيف يتابعني أهلي؟","من صفحة ولي الأمر: أدخل كود الطالب وتابع موقعه أثناء نافذة الرحلة عند تفعيل الاتصال السحابي؛ دون تفعيل تعمل المتابعة على الجهاز نفسه فقط."],["واجهت عطلًا تقنيًا، كيف أبلّغ؟","استخدم زر الإبلاغ عن مشكلة في هذه الصفحة؛ يُرسل التقرير عند تفعيل الاتصال السحابي ويُحفظ محليًا دونه."],["أنا سائق، كيف أسجّل خطي؟","أنشئ حساب سائق وأكمل ملفك (صورة الرخصة مطلوبة)، ثم أنشئ خطك من لوحة السائق؛ لا يُنشر الخط إلا بعد موافقة الإدارة من لوحة التحكم."]];
document.getElementById("faq").innerHTML=FAQ.map((f,i)=>`<div class="card" style="margin:8px 0;padding:10px"><b style="cursor:pointer" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display=='none'?'block':'none'">▸ ${f[0]}</b><div style="display:none;margin-top:6px;font-size:14px">${f[1]}</div></div>`).join("");
const me=K.get("me",null);if(me)document.getElementById("sname").value=me.name||"";
document.getElementById("send").onclick=()=>{
const n=document.getElementById("sname").value.trim(),m=document.getElementById("smsg").value.trim();
if(!n||!m){alert("اكتب اسمك ورسالتك أولًا");return}
const box=K.get("support_msgs",[]);box.push({name:n,topic:document.getElementById("stopic").value,msg:m,at:new Date().toISOString()});try{K.set("support_msgs",box)}catch(e){return}
document.getElementById("smsg").value="";document.getElementById("sok").style.display="block";};
</script>
</body></html>
