<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة السائق</title><link rel="stylesheet" href="../assets/style.css"></head>
<body><div class="wrap"><main id="app"></main></div>
<script src="../assets/runtime.js"></script><script src="../assets/data.js"></script><script src="../assets/core.js"></script><script src="../assets/demo.js"></script><script src="../assets/app.js"></script><script src="../assets/journey.js"></script>
<script>
(function(){
if(!K.access())return;
K.page("لوحة السائق","../index.html");
const l=K.line(MYDRIVER.lineId);
$("#app").innerHTML=`
<div class="card"><div class="mut">أهلًا ${MYDRIVER.name} 👋</div>
<div class="route" style="font-size:18px;font-weight:800;margin:6px 0">خطّي: ${K.esc(l.from)} ← ${K.esc(l.to)}</div>
<div class="row">${K.badge(l.comp)}${K.trusted(l)}</div></div>
<div class="stats">
<div class="stat"><b>${l.seats-l.free}</b><span>مشترك</span></div>
<div class="stat"><b>${K.fmt((l.seats-l.free)*l.price)}</b><span>دخل الشهر</span></div>
<div class="stat"><b>${l.rating} ★</b><span>تقييمي (${l.rc})</span></div></div>
<div class="card"><h3>📊 تقرير الشهر</h3>
<div class="mut">أيام الذروة: <b>الأحد — الثلاثاء</b></div>
<div class="mut">معدل الالتزام بالمواعيد: <b>94%</b></div>
<div class="bar"><i style="width:94%"></i></div>
<div class="mut" style="margin-top:6px">💡 حافظ على تقييمك فوق 4.5 لتبقى في مقدمة نتائج البحث.</div></div>
<div class="card"><h3>🗺️ خريطة الطلب — ركاب بانتظار خطوط</h3>
${DEMAND.map(d=>`<div class="alert" style="margin-bottom:8px"><b>${d.n} راكبًا</b> يطلبون: ${d.route} <span class="badge ${d.comp==="girls"?"b-g":d.comp==="boys"?"b-b":"b-m"}">${COMP[d.comp]}</span><br><button class="btn btn-a btn-s" style="margin-top:6px" onclick="K.toast('فكرة ممتازة! سجّل خطًا جديدًا بهذا المسار من إدارة الخطوط')">افتح خطًا بهذا المسار</button></div>`).join("")}</div>
<div class="card"><h3>إدارة</h3>
<a class="btn btn-p" href="line-edit.html">⚙️ إدارة الخط (المسار، الأوقات، المقاعد، الصفة)</a>
<a class="btn btn-g" href="broadcast.html">📢 بث جماعي للركاب</a>
<a class="btn btn-g" href="holiday-post.html">🎉 رحلات العطل — أعلن مقاعد شاغرة</a>
<a class="btn btn-g" href="ratings.html">⭐ التقييمات والتعليقات (${l.comments.filter(c=>!c.r).length} بانتظار الرد)</a></div>`;
})();
</script></body></html>
