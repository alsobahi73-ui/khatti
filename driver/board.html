<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تحقق الصعود — خطّي</title><link rel="stylesheet" href="../assets/style.css"><link rel="stylesheet" href="../assets/style-v2.css"></head>
<body><div class="wrap"><main id="app"></main></div>
<script src="../assets/data.js"></script><script src="../assets/core.js"></script><script src="../assets/demo.js"></script><script src="../assets/app.js"></script>
<script>
(function(){
  if(!K.access())return;
  K.page("تحقق صعود الركاب","index.html");
function render(){
const bs=K.get("bookings",[]).filter(b=>b.lineId===MYDRIVER.lineId&&b.status==="upcoming"&&!b.boarded);
const done=K.get("bookings",[]).filter(b=>b.lineId===MYDRIVER.lineId&&b.status==="upcoming"&&b.boarded);
$("#app").innerHTML=`
<div class="card"><h3>🎫 تحقق من صعود الراكب</h3>
<div class="mut" style="font-size:13px;margin-bottom:8px">محاكاة محلية فقط، دون تحقق أمني بين الأجهزة. اطلب من الراكب رمز الصعود (PIN) الظاهر في حجزه — لا توجد قراءة QR فعلية في هذه النسخة.</div>
<div class="field"><label for="pin">رمز الصعود (4 أرقام)</label><input id="pin" inputmode="numeric" maxlength="4" placeholder="••••" dir="ltr" style="text-align:center;letter-spacing:8px;font-size:22px"></div>
<div class="row"><button class="btn btn-a grow" id="verify">تحقق وسجّل الصعود ✓</button><button class="btn btn-g" id="scan">📷 مسح QR</button></div></div>
<div class="card"><h3>⏳ بانتظار الصعود (${bs.length})</h3>
${bs.length?bs.map(b=>{const l=K.line(b.lineId);return `<div class="row" style="padding:6px 0;border-bottom:1px solid #e2e8f0"><span>🧑‍🎓 ${K.esc(K.pname())}</span><span class="grow"></span><span class="mut">${K.esc(l.from)} ← ${K.esc(l.to)} • ${K.esc(b.type||"")}</span></div>`}).join(""):'<div class="mut">لا توجد حجوزات بانتظار الصعود.</div>'}</div>
${done.length?`<div class="card"><h3>✅ صعدوا (${done.length})</h3>${done.map(b=>`<div class="mut">✓ ${K.esc(b.boardName||"راكب")} — ${K.esc(b.boardAt||"")}</div>`).join("")}</div>`:""}`;
$("#verify").onclick=()=>{
const pin=$("#pin").value.trim();
if(!/^\d{4}$/.test(pin)){K.toast("أدخل رمزًا من 4 أرقام");return}
const bs=K.get("bookings",[]);const b=bs.find(x=>x.lineId===MYDRIVER.lineId&&x.status==="upcoming"&&x.pin===pin&&!x.boarded);
if(!b){K.toast("رمز غير صالح أو مستخدم مسبقًا ❌");return}
b.boarded=true;b.boardAt=new Date().toLocaleTimeString("ar",{hour:"2-digit",minute:"2-digit"});b.boardName=K.pname();
const tr=K.get("trips",[]);const t=tr.find(x=>x.id===b.id&&x.lineId===b.lineId);if(t)t.boarded=true;
try{K.commit({bookings:bs,trips:tr,boardEv:{name:b.boardName,time:b.boardAt}})}catch(e){K.toast("لم تكتمل العملية؛ تعذّر حفظ الصعود التجريبي");return}
K.toast("✅ تسجيل صعود تجريبي محلي — "+b.boardName);setTimeout(render,800)};
$("#scan").onclick=()=>K.toast("📷 مسح QR متاح في النسخة الحقيقية — استخدم رمز PIN في النسخة التجريبية");
}
render();
})();
</script></body></html>
