<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>تعديل بيانات الخط — خطي</title><link rel="stylesheet" href="../assets/style.css"></head>
<body><div class="wrap"><main id="app">
<div class="card"><h3>⚙️ تعديل بيانات المسار والاشتراك</h3>
<div class="field"><label for="from">منطقة الانطلاق</label><select id="from"></select></div>
<div class="field"><label for="to">الوجهة / الجامعة</label><select id="to"></select></div>
<div class="row">
  <div class="field grow"><label for="go">وقت الانطلاق (صباحاً)</label><input id="go" type="time" value="07:00"></div>
  <div class="field grow"><label for="back">وقت العودة (مساءً)</label><input id="back" type="time" value="14:30"></div>
</div>
<div class="row">
  <div class="field grow"><label for="seats">عدد المقاعد الكلي (1-60)</label><input id="seats" type="number" min="1" max="60"></div>
  <div class="field grow"><label for="free">المقاعد الشاغرة حالياً</label><input id="free" type="number" min="0" max="60"></div>
</div>
<div class="field"><label for="price">سعر الاشتراك الشهري (د.ع)</label><input id="price" type="number" min="0"></div>
<div class="field"><label for="vehicle">المركبة</label><input id="vehicle" type="text"></div>
<div class="field"><label for="plate">رقم اللوحة</label><input id="plate" type="text"></div>
<div class="field"><label for="pickups">نقاط التجمع (مفصولة بفاصلة)</label><input id="pickups" type="text"></div>
<div class="field"><label for="comp">فئة الخط</label><select id="comp"><option value="girls">طالبات / نسائي فقط</option><option value="mixed">مختلط</option><option value="boys">طلاب / شباب فقط</option></select></div>
<button class="btn btn-p" id="save">حفظ التغييرات</button>
</div>
</main></div>
<script src="../assets/data.js"></script><script src="../assets/core.js"></script><script src="../assets/demo.js"></script><script src="../assets/auth.js"></script><script src="../assets/cloud.js"></script><script src="../assets/app.js"></script>
<script>
(function(){
  if(!K.access())return;
  const qs=new URLSearchParams(location.search);
  const isNew=qs.get("new")==="1";
  const reqId=(qs.get("id")||"").trim();
  const cloud=window.KhattiCloud;
  const auth=window.KhattiAuth;
  const sess=auth&&typeof auth.readStoredSession==="function"?auth.readStoredSession():null;
  const isCloudDriver=Boolean(cloud&&typeof cloud.isConfigured==="function"&&cloud.isConfigured()&&sess&&sess.user&&sess.user.role==="driver");

  K.page(isNew?"إنشاء خط جديد":"تعديل بيانات الخط","index.html");

  let targetId=isNew?"":(reqId||MYDRIVER.lineId);
  let l=isNew?{
    id:"",
    from:AREAS[0],
    to:(LINES[0]&&LINES[0].to)||AREAS[1],
    go:"07:00",
    back:"14:30",
    price:60000,
    seats:14,
    free:14,
    vehicle:MYDRIVER.vehicle||"",
    plate:MYDRIVER.plate||"",
    pickups:[AREAS[0]],
    comp:"mixed"
  }:K.line(targetId);

  if(!l&&!isCloudDriver){K.missing();return;}
  if(!l){
    l={
      id:targetId,
      from:AREAS[0],
      to:(LINES[0]&&LINES[0].to)||AREAS[1],
      go:"07:00",
      back:"14:30",
      price:60000,
      seats:14,
      free:14,
      vehicle:MYDRIVER.vehicle||"",
      plate:MYDRIVER.plate||"",
      pickups:[AREAS[0]],
      comp:"mixed"
    };
  }

  function populateForm(lineData){
    $("#from").innerHTML=AREAS.map(a=>`<option ${a===lineData.from?'selected':''}>${K.esc(a)}</option>`).join("");
    $("#to").innerHTML=[...new Set([lineData.to,...LINES.map(x=>x.to),...AREAS])].filter(Boolean).map(a=>`<option ${a===lineData.to?'selected':''}>${K.esc(a)}</option>`).join("");
    $("#go").value=lineData.go||"07:00";
    $("#back").value=lineData.back||"14:30";
    $("#price").value=lineData.price!==undefined?lineData.price:60000;
    $("#seats").value=lineData.seats!==undefined?lineData.seats:14;
    $("#free").value=lineData.free!==undefined?lineData.free:lineData.seats;
    $("#vehicle").value=lineData.vehicle||lineData.type||MYDRIVER.vehicle||"";
    $("#plate").value=lineData.plate||MYDRIVER.plate||"";
    $("#pickups").value=Array.isArray(lineData.pickups)?lineData.pickups.join("، "):"";
    $("#comp").value=lineData.comp||"mixed";
  }

  populateForm(l);

  if(isCloudDriver&&!isNew&&typeof cloud.fetchLines==="function"){
    cloud.fetchLines().then(rows=>{
      if(!Array.isArray(rows))return;
      const found=reqId
        ?rows.find(x=>x&&x.id===reqId)
        :(rows.find(x=>x&&String(x.driver_id||x.driverId||"")===String(sess.user.id))||rows.find(x=>x&&x.id===targetId));
      if(found){
        l=found;
        targetId=found.id;
        populateForm(found);
      }
    }).catch(()=>{});
  }

  $("#save").onclick=async function(){
    const seats=$("#seats").value;
    const free=$("#free").value;
    const price=$("#price").value;
    const go=$("#go").value;
    const back=$("#back").value;
    if(!KhattiCore.integer(seats,1,60)){K.toast("عدد المقاعد يجب أن يكون بين 1 و 60");return;}
    if(!KhattiCore.integer(free,0,seats)){K.toast("عدد المقاعد الشاغرة غير صالح");return;}
    if(!KhattiCore.integer(price,0,10000000)){K.toast("سعر الاشتراك غير صالح");return;}
    if(!KhattiCore.time(go)||!KhattiCore.time(back)){K.toast("يرجى إدخال أوقات صحيحة");return;}
    const pickups=$("#pickups").value.split(/[،,]/).map(s=>s.trim()).filter(Boolean);
    const localBooked=(!isCloudDriver&&l.id)?K.get("bookings",[]).filter(b=>b.lineId===l.id&&b.status==="upcoming").reduce((sum,b)=>sum+(Array.isArray(b.seats)?b.seats.length:1),0):0;
    if(Number(free)+localBooked>Number(seats)){K.toast("المقاعد الشاغرة والحجوزات الحالية تتجاوز سعة المركبة");return;}
    if(!COMP[$("#comp").value]||!pickups.length){K.toast("اختر فئة الخط وأدخل نقطة تجمع واحدة على الأقل");return;}

    const vehicleVal=$("#vehicle").value.trim()||l.vehicle||"حافلة";
    const plateVal=($("#plate")?.value||"").trim()||l.plate||"";

    if(isCloudDriver&&typeof cloud.pushLine==="function"){
      const saveBtn=$("#save");
      if(saveBtn)saveBtn.disabled=true;
      const linePayload={
        ...(isNew?{_new:true}:{id:targetId}),
        from:$("#from").value,
        to:$("#to").value,
        vehicle:vehicleVal,
        type:vehicleVal,
        plate:plateVal,
        comp:$("#comp").value,
        price:Number(price),
        seats:Number(seats),
        free:Number(free),
        go,
        back,
        pickups,
        driver_name:K.dname(),
        phone:K.get("driver",null)?.phone||K.get("draft_dP","")||l.phone||MYDRIVER.phone||"07700000000"
      };
      const ok=await cloud.pushLine(linePayload);
      if(saveBtn)saveBtn.disabled=false;
      if(!ok){
        K.toast("تعذّر حفظ بيانات الخط سحابيًا؛ تحقق من الاتصال أو الصلاحيات وحاول مجددًا");
        return;
      }
      if(typeof cloud.pushBroadcast==="function"){
        try{
          const broadcastLineId=linePayload.id||targetId||l.id||MYDRIVER.lineId||"l1";
          const alertMsg=KhattiCore.buildLineUpdateBroadcastMsg(linePayload);
          await cloud.pushBroadcast({line_id:broadcastLineId,msg:alertMsg});
        }catch(_){}
      }
      K.toast(isNew?"تم إنشاء الخط سحابيًا بنجاح":"تم حفظ تعديلات الخط سحابيًا بنجاح");
      setTimeout(()=>location.href="index.html",900);
      return;
    }

    const edits=K.get("lineEdits",{});
    edits[l.id]={
      from:$("#from").value,
      to:$("#to").value,
      go,
      back,
      seats:Number(seats),
      free:Number(free)+localBooked,
      price:Number(price),
      vehicle:vehicleVal,
      pickups,
      comp:$("#comp").value
    };
    K.set("lineEdits",edits);
    K.toast("حُفظت بيانات الخط محليًا فقط");
    setTimeout(()=>location.href="index.html",900);
  };
})();
</script>
</body></html>
