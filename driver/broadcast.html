<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بث جماعي</title><link rel="stylesheet" href="../assets/style.css"></head>
<body><div class="wrap"><main id="app"></main></div>
<script src="../assets/runtime.js"></script><script src="../assets/data.js"></script><script src="../assets/core.js"></script><script src="../assets/demo.js"></script><script src="../assets/app.js"></script>
<script>
(function(){
if(!K.access())return;
K.page("بث جماعي","index.html");
const l=K.line(MYDRIVER.lineId);
function render(){const b=K.get("broadcasts",[]);
$("#app").innerHTML=`
<div class="card"><h3>📢 إعلان لركاب الرحلة</h3>
<div class="mut">محاكاة محلية لن تصل إلى <b>${l.seats-l.free} مشتركًا</b> في خط ${K.esc(l.from)} ← ${K.esc(l.to)} — بدل 18 محادثة منفصلة.</div>
<div class="field" style="margin-top:10px"><textarea id="txt" placeholder="مثال: الباص تعطل صباحًا — البديل قادم خلال ٢٠ دقيقة"></textarea></div>
<div class="qr"><button data-q="تأخرت ١٠ دقائق بسبب الازدحام">تأخرت ١٠ دقائق بسبب الازدحام</button><button data-q="غدًا عطلة — لا توجد رحلات">غدًا عطلة — لا توجد رحلات</button><button data-q="تم تغيير نقطة الالتقاط الثانية">تم تغيير نقطة الالتقاط الثانية</button></div>
<button class="btn btn-p" id="send">إرسال للجميع 📢</button></div>
<div class="card"><h3>إعلانات سابقة</h3>${b.length?b.map(x=>`<div class="alert" style="margin-bottom:8px">${K.esc(x.t)}<small>${K.esc(x.d)}</small></div>`).join(""):'<div class="mut">لا توجد إعلانات بعد.</div>'}</div>`;
$$(".qr [data-q]").forEach(q=>q.onclick=()=>{$("#txt").value=q.dataset.q});
$("#send").onclick=()=>{const v=$("#txt").value.trim();if(!v||v.length>2000){K.toast("اكتب نص الإعلان أولًا");return}
const b=K.get("broadcasts",[]);b.unshift({t:v,d:"الآن"});K.set("broadcasts",b);K.toast(`حُفظ الإعلان محليًا؛ لم يُرسل لأي مشترك`);render()}}
render();
})();
</script></body></html>
