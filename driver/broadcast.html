<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>إرسال تنبيه — خطي</title><link rel="stylesheet" href="../assets/style.css"></head>
<body><div class="wrap"><main id="app">
<div class="card"><h3>📢 إرسال تنبيه عام للمشتركين والأهالي</h3>
<div class="field"><label>نص التنبيه أو الإشعار</label>
<textarea id="msg" rows="4" placeholder="مثال: يرجى العلم بوجود تأخير 15 دقيقة بسبب الازدحام المروري..."></textarea>
</div>
<button class="btn btn-p" id="send">حفظ تنبيه تجريبي محلي</button>
</div>
<div class="card"><h3>📜 التنبيهات السابقة</h3><div id="history"></div></div>
</main></div>
<script src="../assets/data.js"></script><script src="../assets/core.js"></script><script src="../assets/demo.js"></script><script src="../assets/app.js"></script>
<script>
(function(){
  if(!K.access())return;
  K.page("إرسال تنبيه","index.html");
  $("#send").onclick=function(){
    const msg=$("#msg").value.trim();
    if(!msg||msg.length>2000){K.toast("يرجى كتابة نص التنبيه");return;}
    const broadcasts=K.get("broadcasts",[]);
    const now=new Date().toLocaleTimeString('ar-IQ',{hour:'2-digit',minute:'2-digit'});
    broadcasts.unshift({id:"b_"+Date.now(),msg,t:msg,time:now,d:now});
    K.set("broadcasts",broadcasts);
    K.toast("حُفظ التنبيه محليًا؛ لم يُرسل لأي مشترك");
    $("#msg").value="";
    render();
  };
  function render(){
    const list=K.get("broadcasts",[]);
    $("#history").innerHTML=list.length===0?'<div class="mut">لا توجد تنبيهات سابقة.</div>':
      list.map(b=>`<div class="note" style="margin-bottom:8px;"><strong>${K.esc(b.time||b.d||"الآن")}:</strong> ${K.esc(b.msg||b.t||"")}</div>`).join("");
  }
  render();
})();
</script>
</body></html>
