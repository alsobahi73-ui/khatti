<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>تقييمات وآراء المشتركين — خطي</title><link rel="stylesheet" href="../assets/style.css"></head>
<body><div class="wrap"><main id="app">
<div class="card"><h3>⭐ تقييمات وآراء المشتركين</h3>
<div id="ratings-list"></div>
</div>
</main></div>
<script src="../assets/data.js"></script><script src="../assets/core.js"></script><script src="../assets/demo.js"></script><script src="../assets/app.js"></script>
<script>
(function(){
  if(!K.access())return;
  K.page("تقييمات وآراء المشتركين","index.html");
  function render(){
    const l=K.line(MYDRIVER.lineId);
    if(!l||!Array.isArray(l.comments)||l.comments.length===0){
      $("#ratings-list").innerHTML='<div class="mut">لا توجد تقييمات حتى الآن.</div>';
      return;
    }
    $("#ratings-list").innerHTML=l.comments.map((c,i)=>`
      <div class="card" style="margin-bottom:10px;">
        <div><strong>${K.esc(c.u)}</strong> — <span style="color:#f59e0b;">${'★'.repeat(Math.max(1,Math.min(5,Number(c.s)||5)))}</span></div>
        <p style="margin:4px 0;">"${K.esc(c.t)}"</p>
        ${c.r ? `<div class="note" style="margin-top:6px;background:#f0fdf4;"><strong>ردك:</strong> ${K.esc(c.r)}</div>` : `
          <div style="margin-top:6px;">
            <input aria-label="رد تجريبي على التقييم ${i+1}" id="reply-${i}" placeholder="اكتب ردك على هذا التقييم..." style="width:70%;display:inline-block;padding:6px;">
            <button class="btn btn-p" onclick="sendReply(${i})" style="width:25%;display:inline-block;">رد</button>
          </div>
        `}
      </div>
    `).join("");
  }

  window.sendReply=function(idx){
    const l=K.line(MYDRIVER.lineId);
    const input=$(`#reply-${idx}`);
    const replyText=input?input.value.trim():"";
    if(!replyText){K.toast("يرجى كتابة الرد أولاً");return;}
    const comments=Array.isArray(l.comments)?[...l.comments]:[];
    if(!comments[idx])return;
    comments[idx]={...comments[idx],r:replyText};
    const allComments=K.get("myComments",{});
    allComments[l.id]=comments;
    K.set("myComments",allComments);
    K.toast("حُفظ الرد محليًا للتجربة؛ لم يُرسل");
    render();
  };

  render();
})();
</script>
</body></html>
