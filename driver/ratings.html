<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>تقييمات وآراء المشتركين — خطي</title><link rel="stylesheet" href="../assets/style.css"></head>
<body><div class="wrap"><main id="app">
<div class="card"><h3>⭐ تقييمات وآراء المشتركين</h3>
<div id="ratings-list"></div>
</div>
</main></div>
<script src="../assets/data.js"></script><script src="../assets/core.js"></script><script src="../assets/demo.js"></script><script src="../assets/auth.js"></script><script src="../assets/cloud.js"></script><script src="../assets/app.js"></script>
<script>
(function(){
  if(!K.access())return;
  K.page("تقييمات وآراء المشتركين","index.html");
  const cloudOtherRated={};
  let cloudChecked=false;
  function render(){
    const l=K.line(MYDRIVER.lineId);
    const pxRatings=K.get("pxRatings",{});
    const comments=l&&Array.isArray(l.comments)?l.comments:[];
    const trips=K.get("trips",[]).filter(t=>t&&t.lineId===(l?l.id:MYDRIVER.lineId)&&t.status==="done");
    const paxRatings=K.get("ratings",[]);
    if(comments.length===0&&trips.length===0){
      $("#ratings-list").innerHTML='<div class="mut">لا توجد تقييمات حتى الآن.</div>';
      return;
    }
    const cloud=window.KhattiCloud;
    if(!cloudChecked&&trips.length>0&&cloud&&typeof cloud.isConfigured==="function"&&cloud.isConfigured()&&typeof cloud.hasOtherRating==="function"){
      cloudChecked=true;
      Promise.all(trips.map(t=>cloud.hasOtherRating(t.id,"driver").then(has=>{
        if(has){
          cloudOtherRated[t.id]=true;
          return true;
        }
        return false;
      }).catch(()=>false))).then(results=>{
        if(results.some(Boolean))render();
      });
    }
    const commentsHTML=comments.map((c,i)=>{
      const myRated=Boolean(c.myRated||c.driverRated||c.r||(c.tripId&&KhattiCore.record(pxRatings)&&pxRatings[c.tripId]));
      const otherRated=c.otherRated!==undefined?Boolean(c.otherRated):Boolean(c.s!==undefined||c.stars!==undefined||c.t);
      if(!KhattiCore.resolveRatingReveal(myRated,otherRated)){
        return `<div class="card" style="margin-bottom:10px;"><div><strong>${K.esc(c.u||"مشترك")}</strong></div><div class="mut" style="margin-top:4px;">بانتظار تقييم الطرف الآخر</div>${!myRated?`<div style="margin-top:6px;"><input aria-label="رد تجريبي على التقييم ${i+1}" id="reply-${i}" placeholder="قيّم أو اكتب ردك لفتح التقييم..." style="width:70%;display:inline-block;padding:6px;"><button class="btn btn-p" onclick="sendReply(${i})" style="width:25%;display:inline-block;">رد</button></div>`:""}</div>`;
      }
      const rawStars=Number(c.s??c.stars);
      const hasStars=Number.isFinite(rawStars)&&rawStars>=1&&rawStars<=5;
      const commentTxt=typeof c.t==="string"?c.t.trim():(typeof c.comment==="string"?c.comment.trim():"");
      if(!hasStars&&!commentTxt){
        return `<div class="card" style="margin-bottom:10px;"><div><strong>${K.esc(c.u||"مشترك")}</strong></div><div class="mut">لا توجد بيانات تقييم مسجّلة من الطرف الآخر.</div></div>`;
      }
      return `
      <div class="card" style="margin-bottom:10px;">
        <div><strong>${K.esc(c.u||"مشترك")}</strong>${hasStars?` — <span style="color:#f59e0b;">${'★'.repeat(Math.max(1,Math.min(5,Math.round(rawStars))))}</span>`:""}</div>
        ${commentTxt?`<p style="margin:4px 0;">"${K.esc(commentTxt)}"</p>`:""}
        ${c.r ? `<div class="note" style="margin-top:6px;background:#f0fdf4;"><strong>ردك:</strong> ${K.esc(c.r)}</div>` : `
          <div style="margin-top:6px;">
            <input aria-label="رد تجريبي على التقييم ${i+1}" id="reply-${i}" placeholder="اكتب ردك على هذا التقييم..." style="width:70%;display:inline-block;padding:6px;">
            <button class="btn btn-p" onclick="sendReply(${i})" style="width:25%;display:inline-block;">رد</button>
          </div>
        `}
      </div>`;
    }).join("");
    const tripsHTML=trips.map(t=>{
      const pr=paxRatings.find(r=>r&&r.tripId===t.id)||null;
      const myRated=Boolean(t.driverRated||(KhattiCore.record(pxRatings)&&pxRatings[t.id]));
      const otherRated=Boolean(cloudOtherRated[t.id]||t.rated||pr);
      const formHTML=!myRated?`
        <div style="margin-top:8px;">
          <div class="field"><label for="dstar-${K.esc(t.id)}">تقييم الراكب (1-5)</label><select id="dstar-${K.esc(t.id)}"><option value="5">5 ★</option><option value="4">4 ★</option><option value="3">3 ★</option><option value="2">2 ★</option><option value="1">1 ★</option></select></div>
          <div class="field"><label for="dtxt-${K.esc(t.id)}">تعليق اختياري</label><textarea id="dtxt-${K.esc(t.id)}" rows="2" maxlength="2000" placeholder="اكتب تعليقك عن الراكب (اختياري)..."></textarea></div>
          <button type="button" class="btn btn-p" id="drate-${K.esc(t.id)}" data-rate-trip="${K.esc(t.id)}">حفظ تقييمي</button>
        </div>`:"";
      if(!KhattiCore.resolveRatingReveal(myRated,otherRated)){
        return `<div class="card" style="margin-bottom:10px;"><div><strong>${K.esc(K.pname())}</strong> <span class="mut">(${K.esc(t.when||t.id)})</span></div><div class="mut" style="margin-top:4px;">بانتظار تقييم الطرف الآخر</div>${formHTML}</div>`;
      }
      const starsVal=pr?Number(pr.stars??pr.s):NaN;
      const commentTxt=pr?String(pr.comment??pr.t??"").trim():"";
      if(!pr||!Number.isFinite(starsVal)||starsVal<1||starsVal>5){
        return `<div class="card" style="margin-bottom:10px;"><div><strong>${K.esc(K.pname())}</strong> <span class="mut">(${K.esc(t.when||t.id)})</span></div><div class="mut" style="margin-top:4px;">${cloudOtherRated[t.id]?"تم استلام تقييم الطرف الآخر وتأكيد الكشف المتبادل ✓":"لا توجد بيانات تقييم مسجّلة من الطرف الآخر."}</div>${formHTML}</div>`;
      }
      return `<div class="card" style="margin-bottom:10px;"><div><strong>${K.esc(K.pname())}</strong> — <span style="color:#f59e0b;">${'★'.repeat(Math.round(starsVal))}</span></div>${commentTxt?`<p style="margin:4px 0;">"${K.esc(commentTxt)}"</p>`:""}${formHTML}</div>`;
    }).join("");
    $("#ratings-list").innerHTML=commentsHTML+tripsHTML;
  }

  /* تصليب (ل-5): معرّف الرحلة عبر data-* بدل سلسلة JS مضمّنة في onclick */
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-rate-trip]");
    if(b && window.saveDriverRating) window.saveDriverRating(b.dataset.rateTrip);
  });

  window.saveDriverRating=function(tripId){
    const l=K.line(MYDRIVER.lineId);
    const allTrips=K.get("trips",[]);
    const target=allTrips.find(t=>t&&t.id===tripId);
    if(!target||target.status!=="done"){K.toast("الرحلة غير مكتملة");return;}
    const starEl=$(`#dstar-${tripId}`);
    const txtEl=$(`#dtxt-${tripId}`);
    const stars=Number(starEl?starEl.value:5);
    if(!KhattiCore.integer(stars,1,5)){K.toast("اختر تقييمًا من 1 إلى 5");return;}
    const comment=txtEl?txtEl.value.trim():"";
    const rawPx=K.get("pxRatings",{});
    const pxRatings=KhattiCore.record(rawPx)?{...rawPx}:{};
    pxRatings[tripId]={tripId,stars,comment,demo:true};
    const nextTrips=allTrips.map(t=>t&&t.id===tripId?{...t,driverRated:true}:t);
    try{
      K.commit({pxRatings,trips:nextTrips});
    }catch(e){
      K.toast("لم تكتمل العملية؛ تعذّر حفظ التقييم");
      return;
    }
    K.toast("حُفظ التقييم محليًا للتجربة؛ لم يُرسل");
    const cloud=window.KhattiCloud;
    if(cloud&&typeof cloud.isConfigured==="function"&&cloud.isConfigured()&&typeof cloud.pushRating==="function"){
      cloud.pushRating({tripId,lineId:target.lineId||(l?l.id:MYDRIVER.lineId)||"",role:"driver",stars,comment}).then(ok=>{
        if(!ok)K.toast("تعذّر مزامنة التقييم سحابيًا؛ تم الحفظ محليًا");
      }).catch(()=>{
        K.toast("تعذّر مزامنة التقييم سحابيًا؛ تم الحفظ محليًا");
      });
    }
    render();
  };

  window.sendReply=function(idx){
    const l=K.line(MYDRIVER.lineId);
    const input=$(`#reply-${idx}`);
    const replyText=input?input.value.trim():"";
    if(!replyText){K.toast("يرجى كتابة الرد أولاً");return;}
    const comments=Array.isArray(l.comments)?[...l.comments]:[];
    if(!comments[idx])return;
    comments[idx]={...comments[idx],r:replyText};
    const allComments=K.get("myComments",{});
    allComments[l.id]=comments;
    K.set("myComments",allComments);
    K.toast("حُفظ الرد محليًا للتجربة؛ لم يُرسل");
    render();
  };

  render();
})();
</script>
</body></html>
