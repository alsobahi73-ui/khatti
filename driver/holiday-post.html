<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>نشر رحلة عطلة — خطي</title><link rel="stylesheet" href="../assets/style.css"></head>
<body><div class="wrap"><main id="app">
<div class="note">🎉 <b>خط العطلة والمناسبات</b> — فرصة زيادة الدخل لنقل الطلاب والموظفين في العطل والامتحانات.</div>
<div class="card"><h3>🎉 نشر رحلة خط جديدة</h3>
<div class="field"><label>من</label><select id="pfrom"></select></div>
<div class="field"><label>إلى</label><input id="pto" placeholder="مثال: مول المنصور، باب المعظم..."></div>
<div class="row"><div class="field grow"><label>تاريخ الرحلة</label><input id="pdate" type="date"></div>
<div class="field grow"><label>وقت الانطلاق</label><input id="ptime" type="time" value="08:00"></div></div>
<div class="row"><div class="field grow"><label>المقاعد المتاحة</label><input id="pseats" type="number" min="1" max="60" value="4"></div>
<div class="field grow"><label>سعر المقعد (د.ع)</label><input id="pprice" type="number" min="0" value="5000"></div></div>
<div class="field"><label>الفئة المسموحة</label></div>
<div class="chips" id="pcomp"><button type="button" class="chip" data-c="girls">طالبات فقط</button><button type="button" class="chip" data-c="boys">شباب فقط</button><button type="button" class="chip active" data-c="mixed">مختلط</button></div>
<div class="field"><label>ملاحظة أو تعليمات</label><input id="pnote" placeholder="مثال: الانطلاق 08:00 صباحاً بدون تأخير"></div>
<button class="btn btn-a" id="ppub">📢 نشر الرحلة الآن</button></div>
<h3 style="margin:4px 0 8px;">رحلاتي المعلنة</h3>
<div id="myposts"></div>
<h3 style="margin:4px 0 8px;">📩 الطلبات المباشرة والخاصة</h3>
<div class="mut" style="margin-bottom:8px;">طلبات خاصة من الركاب يمكنك قبولها لإنشاء خط مباشر لها.</div>
<div id="reqs"></div>
</main></div>
<script src="../assets/data.js"></script><script src="../assets/core.js"></script><script src="../assets/demo.js"></script><script src="../assets/app.js"></script>
<script>
(function(){
  if(!K.access())return;
  K.page("نشر خط العطلة والمناسبات","index.html");
  const today=KhattiCore.today();
  let pcomp="mixed";
  $("#pfrom").innerHTML=AREAS.map(a=>`<option>${K.esc(a)}</option>`).join("");
  $("#pdate").min=today;
  $("#pdate").value=today;

  $("#pcomp").addEventListener("click",e=>{
    const btn=e.target.closest(".chip");
    if(!btn)return;
    $$("#pcomp .chip").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    pcomp=btn.dataset.c||"mixed";
  });

  function renderLists(){
    const posts=K.get("holPosts",[]);
    $("#myposts").innerHTML=posts.length===0
      ? '<div class="mut">لم تقم بنشر رحلات عطلة بعد.</div>'
      : posts.map(p=>`<div class="card"><div class="row">${K.badge(p.comp)}<span class="grow"></span><b>${K.fmt(p.price)}</b></div><div class="route" style="font-weight:800;margin:6px 0">${K.esc(p.from)} ← ${K.esc(p.to)}</div><div class="mut">📅 ${K.esc(p.dlabel||p.date)} — 🕒 ${K.esc(p.time)} • 💺 ${p.free}/${p.seats} مقاعد</div>${p.note?`<div class="mut">📝 ${K.esc(p.note)}</div>`:""}</div>`).join("");

    const reqs=(typeof REQS!=="undefined"?REQS:[]).concat(K.get("holReqs",[]));
    $("#reqs").innerHTML=reqs.length===0
      ? '<div class="mut">لا توجد طلبات خاصة حالياً.</div>'
      : reqs.map(r=>`<div class="card"><div class="route"><b>${K.esc(r.from||r.area||"")} ← ${K.esc(r.to||r.dest||"")}</b></div><div class="mut">عدد الركاب: ${r.seats||r.count||1} ${r.note?`• ${K.esc(r.note)}`:""}</div></div>`).join("");
  }

  $("#ppub").onclick=function(){
    const to=$("#pto").value.trim();
    const date=$("#pdate").value;
    const time=$("#ptime").value;
    const seats=Number($("#pseats").value);
    const price=Number($("#pprice").value);
    if(!to){K.toast("يرجى تحديد نقطة الوصول");return;}
    if(!KhattiCore.future(date,time)){K.toast("يرجى اختيار تاريخ ووقت مستقبلي صالح");return;}
    if(!KhattiCore.integer(seats,1,60)){K.toast("عدد المقاعد يجب أن يكون بين 1 و 60");return;}
    if(!KhattiCore.integer(price,0,10000000)){K.toast("سعر المقعد غير صالح");return;}
    const post={
      id:"hp_"+Date.now(),
      driver:K.dname(),
      driverName:K.dname(),
      trusted:true,
      from:$("#pfrom").value,
      to:to,
      date:date,
      dlabel:date,
      time:time,
      seats:seats,
      free:seats,
      price:price,
      comp:pcomp,
      note:$("#pnote").value.trim()
    };
    const posts=K.get("holPosts",[]);
    posts.unshift(post);
    K.set("holPosts",posts);
    K.pushHolNotif(`رحلة عطلة جديدة: ${post.from} ← ${post.to} (${post.date})`,"holiday.html");
    K.toast("تم نشر رحلة العطلة بنجاح");
    $("#pto").value="";
    $("#pnote").value="";
    renderLists();
  };

  renderLists();
})();
</script>
</body></html>
